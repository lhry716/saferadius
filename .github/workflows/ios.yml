name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project SafeRadius.xcodeproj
          -scheme SafeRadius
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/SafeRadius.app SafeRadius-Simulator.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeRadius-iOS-Simulator
          path: SafeRadius-Simulator.zip
          if-no-files-found: error
          retention-days: 14
