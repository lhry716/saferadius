.profile-trigger{background:#FFF;border:1px solid #EEEFEA;display:grid;place-items:center;border-radius:50%;height:42px;width:42px;color:#485457;position:relative}
.profile-trigger:after{content:"";position:absolute;width:8px;height:8px;background:#36AB7F;border-radius:50%;bottom:1px;right:0;border:2px solid white}
.case-field{margin-bottom:12px;border:1px solid #E7E9E6;background:#FFF;border-radius:18px;padding:13px 15px 10px;box-shadow:0 3px 12px #252D3105}
.case-field label{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#3D4849;font-size:12px;font-weight:740;margin-bottom:7px}
.optional{font-size:10px;font-weight:500;color:#9AA1A0}
.case-field textarea{font-family:inherit;display:block;width:100%;resize:vertical;min-height:46px;max-height:95px;background:#F8F9F7;border:1px solid #F0F1EF;border-radius:10px;font-size:12px;color:#2E3839;padding:10px 11px;line-height:1.55;outline:none}
.case-field textarea::placeholder{color:#A2A9A6}
.case-field textarea:focus,.profile-input:focus,.chat-composer input:focus{border-color:#8DBEAF;box-shadow:0 0 0 3px #6AC49A24}
.case-help{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:9.5px;line-height:1.4;color:#9BA2A0}
.event-preview{background:#FFF;border:1px solid #E8EBE8;border-radius:14px;padding:12px 14px;margin-top:13px;text-align:left}
.event-preview .event-label{font-size:10px;font-weight:730;color:#77817F;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.event-preview p{font-size:11px;color:#424B4B;margin:0;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
.incoming-avatar{width:98px;height:98px;margin:32px auto 17px}
.incoming-avatar .icon{width:44px;height:44px}
.incoming-card{margin-top:21px}
.incoming-event{border-top:1px solid #45505A;margin-top:12px;padding-top:12px}
.incoming-event .label{font-size:10px;color:#A5B0B7;margin-bottom:7px}
.incoming-event p{font-size:12px;color:#F0F2F4;margin:0;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;max-height:75px;overflow:auto}
.call-actions{margin-top:30px}
.incoming-fine{margin-top:15px}
.call-person{padding-top:22px}
.call-person .avatar{width:70px;height:70px;margin-bottom:11px}
.call-person h2{font-size:22px}
.call-status{margin-top:17px;padding:13px}
.call-case{margin-top:10px;color:#9FADB8;border:1px solid #35414D;border-radius:12px;padding:9px 12px;font-size:11px;line-height:1.5;max-height:62px;overflow:auto}
.call-case b{font-weight:650;color:#C6D1D9;margin-right:6px}
.call-case span{overflow-wrap:anywhere;white-space:pre-wrap}
.call-controls{padding-top:16px}
.call-control{min-width:57px;position:relative}
.call-control .round{width:54px;height:54px}
.call-control .icon{width:21px;height:21px}
.chat-indicator{position:absolute;right:1px;top:-4px;background:#E65C51;color:#FFF;border-radius:50%;font-size:9px;font-weight:700;min-width:16px;height:16px;display:grid;place-items:center;border:2px solid #161D24}
.chat-sheet{display:flex;flex-direction:column;max-height:78%;height:70%;padding-bottom:24px}
.chat-sheet .handle{flex:0 0 auto}
.chat-sheet .sheet-head{flex:0 0 auto}
.chat-sheet .sheet-head h2{font-size:21px}
.chat-sheet .sheet-head p{margin:0 0 9px}
.chat-feed{display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1;min-height:110px;margin:15px -2px;padding:5px 2px 10px;scrollbar-width:thin}
.chat-bubble{max-width:85%;padding:11px 13px;border-radius:16px;font-size:12px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
.chat-bubble.mine{align-self:flex-end;color:#FFF;background:#2F9774;border-bottom-right-radius:5px}
.chat-bubble.theirs{align-self:flex-start;color:#34413D;background:#EFF2EE;border-bottom-left-radius:5px}
.chat-bubble.system{align-self:center;background:#F5F5F2;color:#8E9794;font-size:10px;text-align:center;padding:9px 12px;max-width:95%}
.chat-who{font-size:9px;color:#8D9895;margin:0 0 4px;padding:0 3px}
.chat-message-group.mine{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;max-width:85%}
.chat-message-group.theirs{align-self:flex-start;display:flex;flex-direction:column;align-items:flex-start;max-width:85%}
.chat-message-group .chat-bubble{max-width:100%}
.chat-composer{border-top:1px solid #E9EBE8;padding-top:13px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.chat-composer input{flex:1;min-width:0;border:1px solid #E6E9E5;border-radius:14px;outline:none;background:#F6F8F5;padding:13px;font:inherit;font-size:12px;color:#26302F}
.chat-send{width:43px;height:43px;border-radius:14px;background:#269876;color:#FFF;display:grid;place-items:center;flex-shrink:0}
.chat-note{font-size:9px;color:#99A09D;text-align:center;padding-top:8px;line-height:1.3}
.profile-header{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.profile-avatar{width:60px;height:60px;border-radius:20px;background:#E9F2EC;color:#3B8968;display:grid;place-items:center}
.profile-header h2{font-size:23px;margin:0 0 5px}
.profile-header p{font-size:11px;margin:0}
.profile-label{display:block;color:#525E5B;font-size:11px;font-weight:700;margin:15px 0 7px}
.profile-input{font:inherit;font-size:12px;width:100%;border:1px solid #E5E9E6;background:#F7F9F7;color:#28332F;outline:none;border-radius:13px;padding:11px 12px}
textarea.profile-input{min-height:76px;resize:vertical;line-height:1.7}
.profile-note{font-size:10px;color:#969F9A;margin:15px 0;line-height:1.7}
@media(max-width:700px){.chat-sheet{height:79%;padding-bottom:76px}.home-screen .home-head{margin-top:14px}}
@media(max-height:740px){.home-screen .sos-halo{width:170px;height:170px}.home-screen .sos-press{width:128px;height:128px}.home-screen .sos-area{margin:10px 0}.home-screen .sos-press strong{font-size:22px}.home-screen .sos-press .icon{width:27px;height:27px}.home-screen .sos-caption{font-size:12px}.call-person{padding-top:12px}.call-person .avatar{width:61px;height:61px}.call-status{margin-top:12px}.call-controls{padding-top:10px}.call-control .round{width:49px;height:49px}}

<main class="layout">
<section class="intro">
  <div class="eyebrow">SAFERADIUS · INTERACTIVE DEMO</div>
  <h1>有需要時，<br><em>有人接起。</em></h1>
  <p>一個為「即時真人互助」而設計的概念原型。遇到危險時發出求助，附近的人接通語音，並決定是否前來協助。</p>
  <div class="intro-features"><div class="intro-feature"><b>01</b>長按 2 秒，啟動求助</div><div class="intro-feature"><b>02</b>第一位回應者接通語音</div><div class="intro-feature"><b>03</b>保持通話，必要時前往現場</div></div>
  <div class="intro-footer">此為前端展示版本，沒有真實的電話、定位、緊急報案或推播功能。</div>
</section>
<div class="phone-frame" aria-label="SafeRadius 手機互動介面">
  <div class="phone">
    <div id="statusbar" class="statusbar"><span>9:41</span><span class="status-icons"><svg class="icon"><use href="#i-signal"/></svg><span style="font-size:11px">◢</span><span class="battery"></span></span></div>
    <div class="phone-content" id="phone-content"></div>
    <div class="home-indicator" id="home-indicator"></div>
  </div>
</div>
<aside class="demo-panel">
 <div class="panel-chip">LIVE PROTOTYPE</div>
 <h3>體驗兩種情境</h3>
 <p>不需要登入，也不會真的撥號。從同一個 App 體驗求助與協助兩端的操作。</p>
 <div class="demo-card">
  <h4>展示控制台 <span class="access-badge">模擬模式</span></h4>
  <button class="demo-btn" data-action="scenario-sos"><svg class="icon"><use href="#i-heart"/></svg><span><strong>情境 1 · 我需要幫助</strong><small>回到首頁，長按 SOS 2 秒</small></span></button>
  <button class="demo-btn" data-action="scenario-incoming"><svg class="icon"><use href="#i-phone"/></svg><span><strong>情境 2 · 我收到求助</strong><small>模擬附近有人發起語音求助</small></span></button>
  <div id="demo-extras"></div>
  <div class="demo-status"><b>目前畫面：</b><span id="state-description">一般首頁</span><br><b>展示提示：</b><span id="state-hint">長按中央 SOS 圓鈕約兩秒</span></div>
  <button class="demo-secondary" data-action="restart">重新開始整段展示</button>
 </div>

<div class="mobile-demo" id="mobile-demo"><span>DEMO</span><button data-action="scenario-sos">求助</button><button class="highlight" data-action="scenario-incoming">收到來電</button><button data-action="demo-next" id="mobile-next">下一步</button></div>
<script>
(()=>{
'use strict';
const esc=(value)=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const ic=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const app=document.getElementById('phone-content');
const statusbar=document.getElementById('statusbar');
const indicator=document.getElementById('home-indicator');
const state={screen:'home',role:'seeker',notify:true,map:false,location:false,going:'talking',mute:false,speaker:false,connectedAt:null,waitingAt:null,overlay:'',toastTimer:null,description:'',profileName:'訪客 01',profileBio:'願意在能力範圍內協助附近的人。',messages:[],seen:{seeker:0,helper:0}};
let holdTicker=null,holdBegin=null,holdPointer=null,completed=false;
const descriptions={home:['一般首頁','長按中央 SOS 圓鈕約兩秒'],waiting:['正在尋找協助者','點「模擬有人接聽」進入通話'],incoming:['收到附近求助','點「接聽協助」進入通話'],call:['App 內語音通話','可切換視角，分享位置並展開導航']};
function toast(msg){const prev=app.querySelector('.toast');if(prev)prev.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;app.appendChild(t);clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>t.remove(),2800)}
function reset(){cancelHold();Object.assign(state,{screen:'home',role:'seeker',map:false,location:false,going:'talking',mute:false,speaker:false,connectedAt:null,waitingAt:null,overlay:'',messages:[],seen:{seeker:0,helper:0}});render()}
function sceneIncoming(){cancelHold();Object.assign(state,{screen:'incoming',role:'helper',map:false,location:false,going:'talking',mute:false,speaker:false,overlay:''});render()}
function startWaiting(){cancelHold();Object.assign(state,{screen:'waiting',role:'seeker',map:false,location:false,going:'talking',mute:false,speaker:false,waitingAt:Date.now(),overlay:''});render()}
function connect(role){Object.assign(state,{screen:'call',role,map:false,going:'talking',mute:false,speaker:false,connectedAt:Date.now(),overlay:'',messages:[{from:'system',text:'已接通語音，可同時透過文字傳送資訊。'}],seen:{seeker:0,helper:0}});render()}
function markGoing(){state.going=state.going==='talking'?'offered':'enroute';render()}
function getCallState(){return state.going==='talking'?['語音協助進行中','雙方可以先確認情況與需要的協助']:state.going==='offered'?['協助者準備前往','協助者已表示願意前往，尚未出發']:['協助者前往中','已回報開始前往，可保持通話']}
function home(){return `<div class="screen home-screen"><header class="brandrow"><div class="brand"><div class="mark">${ic('heart')}</div>SafeRadius</div><button class="profile-trigger" data-action="profile" aria-label="個人資訊與設定" title="個人資訊與設定">${ic('user')}</button></header><div class="home-head"><div class="status-pill"><i class="dot ${state.notify?'':'off'}"></i>${state.notify?'正在接收附近求助':'已暫停接收求助'}</div><h2>需要幫助嗎？</h2><p>當你需要有人在身邊，<br>我們幫你找到附近願意接聽的人。</p></div><section class="sos-area"><div class="sos-halo"><button class="sos-press" id="sos-button" aria-label="長按兩秒立即求助"><span class="progress-ring" id="hold-ring" style="--p:0%"></span>${ic('heart','xl')}<strong>SOS</strong><span>立即求助</span></button></div><div class="sos-caption" id="hold-caption">長按 2 秒，發出求助</div><div class="sos-hint" id="hold-hint">放開可取消 · 完成時震動提示</div></section><section class="case-field"><label for="event-description">簡單描述發生的事 <span class="optional">選填</span></label><textarea id="event-description" maxlength="180" rows="2" placeholder="例如：我在路上感到不安全，希望有人可以過來陪同。">${esc(state.description)}</textarea><div class="case-help"><span>接聽者可先看到這段說明，不影響立即求助</span><span id="event-count">${state.description.length}/180</span></div></section><div class="info-card"><div class="info-text"><div class="ic">${ic('bell')}</div><div><h4>接收附近求助</h4><p>開啟後才能收到即時求助來電</p></div></div><button class="toggle ${state.notify?'on':''}" data-action="toggle-notify" role="switch" aria-checked="${state.notify}" aria-label="接收附近求助通知"></button></div><div class="quick"><span>官方緊急電話</span><button data-action="emergency-110">110</button><span class="sep"></span><button data-action="emergency-119">119</button></div></div>`}
function waiting(){return `<div class="screen search-screen"><div class="screen-head"><button class="back-btn" data-action="cancel-help" aria-label="取消求助">${ic('x','sm')}</button><div><div class="title-top">求助已啟動</div><div class="title-sub">SafeRadius · 緊急互助</div></div></div><div class="radar"><div class="circle c3"></div><div class="circle c2"></div><div class="circle c1"></div><div class="radar-core">${ic('radio','xl')}</div></div><div class="search-message"><h2>正在尋找附近的人</h2><p>已建立求助，等待第一位協助者接聽。<br>請保持網路連線。</p></div>${state.description.trim()?`<div class="event-preview"><div class="event-label">${ic('edit','sm')} 你的事件簡述</div><p>${esc(state.description)}</p></div>`:''}<div class="search-steps"><div class="step">${ic('check')}已建立你的求助</div><div class="step">${ic('check')}示範：已向附近的人發出通知</div><div class="step wait">${ic('clock')}等待第一位協助者接聽</div></div><div class="search-footer"><button class="btn dark" data-action="connect-seeker">${ic('phone')} 模擬有人接聽 <span style="opacity:.6;font-size:10px">DEMO</span></button><button class="btn light" data-action="cancel-help">取消這次求助</button><button class="btn ghost" data-action="emergency-both">官方緊急電話：110／119</button><div class="fineprint">此為展示流程，沒有真的通知或聯絡附近的人。</div></div></div>`}
function incoming(){return `<div class="screen incoming-screen"><div class="incoming-tag">${ic('radio')}附近即時求助</div><div class="incoming-avatar">${ic('user','xl')}</div><h2 class="incoming-title">有人需要幫助</h2><p class="incoming-desc">一位附近的人正在等待接聽</p><div class="incoming-card"><div class="incoming-card-title">求助資訊 · 示範資料</div><div class="incoming-row"><span>求助類型</span><span>即時語音求助</span></div><div class="incoming-row"><span>約略距離</span><span>約 350 公尺（示意）</span></div><div class="incoming-row"><span>精確位置</span><span>尚未分享</span></div><div class="incoming-event"><div class="label">求助者事件簡述</div><p>${esc(state.description.trim()||'我現在遇到一些狀況，希望附近有人可以先和我通話協助。')}</p></div></div><div class="call-actions"><button class="call-action decline" data-action="decline"><span class="circlebtn">${ic('x','xl')}</span><span>略過</span></button><button class="call-action accept" data-action="accept"><span class="circlebtn">${ic('phone','xl')}</span><span>接聽協助</span></button></div><div class="incoming-fine">接聽代表願意通話，<br>不代表必須親自前往現場。</div></div>`}
function call(){const [msg,desc]=getCallState();const helper=state.role==='helper';const duration=state.connectedAt?Math.max(0,Math.floor((Date.now()-state.connectedAt)/1000)):0;const time=`${String(Math.floor(duration/60)).padStart(2,'0')}:${String(duration%60).padStart(2,'0')}`;const unread=state.messages.slice(state.seen[state.role]||0).filter(m=>m.from!=='system'&&m.from!==state.role).length;let btn=helper?state.going==='talking'?`<button class="btn green" data-action="going">${ic('heart')}我願意前往協助</button>`:state.going==='offered'?`<button class="btn green" data-action="going">${ic('nav')}我已開始前往</button>`:`<button class="btn light" disabled>${ic('check')}已回報前往中</button>`:state.location?`<button class="btn light" data-action="toggle-location">${ic('check')}已分享位置 · 點擊停止分享</button>`:`<button class="btn green" data-action="toggle-location">${ic('pin')}分享位置給協助者</button>`;return `<div class="screen call-screen"><div class="call-top"><span class="call-brand">SafeRadius <span style="color:#6E7B87;font-weight:500">/ ${helper?'協助者':'求助者'}視角</span></span><span class="connected"><i class="dot"></i>語音已連接</span></div><section class="call-person"><div class="avatar">${ic('user','xl')}</div><h2>${helper?'正在求助的人':'你的協助者'}</h2><p>通話中 · <span id="call-time">${time}</span></p><div class="equalizer"><i></i><i></i><i></i><i></i><i></i></div></section><div class="call-status"><div class="state-icon">${ic(state.going==='enroute'?'nav':state.going==='offered'?'heart':'phone')}</div><div><h3>${msg}</h3><p>${desc}</p></div></div><div class="call-case"><b>事件</b><span>${esc(state.description.trim()||'即時語音求助，尚未填寫事件簡述')}</span></div><div class="main-call-action">${btn}</div><button class="map-trigger" data-action="map"><div class="map-trigger-inner">${ic('map')}<span><h4>位置與導航</h4><p>${state.location?'已分享給配對的協助者':'精確位置尚未分享'}</p></span></div>${ic('chevron','sm')}</button><div class="call-controls"><button class="call-control" data-action="mute" aria-pressed="${state.mute}"><span class="round ${state.mute?'active':''}">${ic(state.mute?'micoff':'mic')}</span>${state.mute?'取消靜音':'靜音'}</button><button class="call-control" data-action="speaker" aria-pressed="${state.speaker}"><span class="round ${state.speaker?'active':''}">${ic(state.speaker?'volume':'voloff')}</span>${state.speaker?'關閉擴音':'擴音'}</button><button class="call-control" data-action="chat"><span class="round">${ic('message')}${unread?`<span class="chat-indicator">${unread}</span>`:''}</span>訊息</button><button class="call-control" data-action="hangup"><span class="round hang">${ic('phoneoff')}</span>掛斷</button></div><div class="call-bottom"><button data-action="emergency-both">需要緊急服務？110／119</button></div></div>`}
function mapSheet(){const shared=state.location;return `<div class="scrim" data-action="close-overlay"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="位置與導航"><div class="handle"></div><div class="sheet-head"><div><h2>位置與導航</h2><p style="margin-bottom:12px">需要時再展開，通話會持續進行。</p></div><button class="close-sheet" data-action="close-overlay" aria-label="關閉">${ic('x','sm')}</button></div>${shared?`<div class="map-art"><svg class="map-route" viewBox="0 0 250 175" aria-hidden="true"><path d="M12 154 C50 140 40 94 85 102 S155 91 158 57 S214 46 229 17" stroke="#FFF" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M12 154 C50 140 40 94 85 102 S155 91 158 57 S214 46 229 17" stroke="#3884B9" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="1 0"/></svg><div class="map-pin start">${ic('nav','sm')}</div><div class="map-pin end">${ic('pin','sm')}</div><div class="map-label">求助者位置</div></div><span class="map-badge">示意地圖 · 非真實 GPS</span><div class="map-copy">${ic('shield','sm')} 位置僅展示給本次配對的協助者</div>`:`<div class="map-locked">${ic('lock','xl')}<h4>尚未分享精確位置</h4><p>求助者同意後，才會顯示位置與導航。</p></div><span class="map-badge">不會在接聽前公開精確位置</span>`}${state.role==='seeker'?`<button class="btn ${shared?'light':'green'}" data-action="toggle-location">${ic(shared?'x':'pin')}${shared?'停止分享位置':'同意分享我的位置'}</button>`:shared?`<button class="btn green" data-action="nav-sim">${ic('nav')}開啟模擬導航</button>`:`<button class="btn light" disabled>等待求助者分享位置</button>`}<button class="btn ghost" data-action="close-overlay">返回語音通話</button></div>`}
function hangupSheet(){const helper=state.role==='helper';return `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="通話已結束"><div class="handle"></div><div style="color:#B7BEBD;text-align:center;margin-bottom:17px">${ic('phoneoff','lg')}</div><h2 style="text-align:center">${helper?'通話已結束':'你還需要幫助嗎？'}</h2><p style="text-align:center">${helper?'本次語音已中斷，求助是否完成仍由求助者確認。':'通話已結束，但這次求助尚未被標記為完成。'}</p>${helper?`<button class="btn dark" data-action="restart">${ic('check')}完成並返回首頁</button>`:`<button class="btn primary" data-action="retry">${ic('radio')}繼續尋找協助者</button><button class="btn light" data-action="safe">${ic('shield')}我已安全，結束求助</button>`}<div class="mini">掛斷電話 ≠ 自動結束求助事件</div></div>`}
function confirmCancel(){return `<div class="scrim" data-action="close-overlay"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="取消求助"><div class="handle"></div><h2>取消這次求助？</h2><p>取消後將停止尋找協助者。若仍有危險，請優先聯絡官方緊急服務。</p><button class="btn primary" data-action="restart">確認取消求助</button><button class="btn light" data-action="close-overlay">繼續等待</button></div>`}
function emergencySheet(){return `<div class="scrim" data-action="close-overlay"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="緊急服務"><div class="handle"></div><h2>官方緊急服務</h2><p>如涉及立即的人身危險或需要救護，請直接使用手機撥打官方緊急電話。此 Prototype 不會替你撥號。</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><div style="border:1px solid #ECEEED;border-radius:15px;padding:17px;text-align:center"><b style="font-size:24px">110</b><div style="color:#9CA3A2;font-size:11px;margin-top:4px">警察</div></div><div style="border:1px solid #ECEEED;border-radius:15px;padding:17px;text-align:center"><b style="font-size:24px">119</b><div style="color:#9CA3A2;font-size:11px;margin-top:4px">消防救護</div></div></div><button class="btn light" data-action="close-overlay" style="margin-top:15px">關閉</button></div>`}
function profileSheet(){return `<div class="scrim" data-action="close-overlay"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="個人資訊與設定"><div class="handle"></div><div class="sheet-head"><div><div class="profile-header"><div class="profile-avatar">${ic('user','xl')}</div><div><h2>個人資訊</h2><p>讓求助者更安心地與你聯繫</p></div></div></div><button class="close-sheet" data-action="close-overlay" aria-label="關閉">${ic('x','sm')}</button></div><label class="profile-label" for="profile-name">顯示名稱</label><input id="profile-name" class="profile-input" maxlength="24" value="${esc(state.profileName)}" placeholder="例如：小安"><label class="profile-label" for="profile-bio">個人簡介</label><textarea id="profile-bio" class="profile-input" maxlength="120" placeholder="簡單介紹自己">${esc(state.profileBio)}</textarea><label class="profile-label">接收求助偏好</label><div class="info-card"><div class="info-text"><div class="ic">${ic('bell')}</div><div><h4>接收附近求助</h4><p>${state.notify?'已開啟（展示模式）':'已暫停'}</p></div></div><button class="toggle ${state.notify?'on':''}" data-action="toggle-notify-profile" role="switch" aria-checked="${state.notify}" aria-label="接收附近求助通知"></button></div><div class="profile-note">此為示範資料，名稱與個人簡介只保留在目前開啟的頁面，不會上傳。</div><button class="btn dark" data-action="save-profile">${ic('check')}儲存個人資料</button></div>`}
function chatSheet(){const me=state.role;const bubbles=state.messages.map(m=>m.from==='system'?`<div class="chat-bubble system">${esc(m.text)}</div>`:`<div class="chat-message-group ${m.from===me?'mine':'theirs'}"><div class="chat-who">${m.from===me?'我':m.from==='seeker'?'求助者':'協助者'}</div><div class="chat-bubble ${m.from===me?'mine':'theirs'}">${esc(m.text)}</div></div>`).join('');return `<div class="scrim" data-action="close-overlay"></div><div class="sheet chat-sheet" role="dialog" aria-modal="true" aria-label="通話中的訊息"><div class="handle"></div><div class="sheet-head"><div><h2>即時訊息</h2><p>語音持續進行 · ${me==='seeker'?'你是求助者':'你是協助者'}</p></div><button class="close-sheet" data-action="close-overlay" aria-label="關閉聊天">${ic('x','sm')}</button></div><div class="chat-feed" id="chat-feed" aria-live="polite">${bubbles}</div><form id="chat-form" class="chat-composer" autocomplete="off"><input id="chat-input" aria-label="輸入訊息" maxlength="220" placeholder="輸入訊息…" required><button class="chat-send" type="submit" aria-label="傳送訊息">${ic('send')}</button></form><div class="chat-note">此為雙方視角模擬聊天，沒有真的傳送訊息</div></div>`}
function sendChat(){const input=document.getElementById('chat-input');if(!input)return;const msg=input.value.trim();if(!msg)return;state.messages.push({from:state.role,text:msg.slice(0,220)});state.seen[state.role]=state.messages.length;render();const feed=document.getElementById('chat-feed');if(feed)feed.scrollTop=feed.scrollHeight;const next=document.getElementById('chat-input');if(next)next.focus()}

function render(){app.innerHTML=state.screen==='home'?home():state.screen==='waiting'?waiting():state.screen==='incoming'?incoming():call();if(state.overlay){app.insertAdjacentHTML('beforeend',state.overlay==='map'?mapSheet():state.overlay==='chat'?chatSheet():state.overlay==='hangup'?hangupSheet():state.overlay==='cancel'?confirmCancel():state.overlay==='profile'?profileSheet():emergencySheet())}const dark=state.screen==='call'||state.screen==='incoming';statusbar.classList.toggle('dark',dark);indicator.classList.toggle('dark',dark);const [title,hint]=descriptions[state.screen];document.getElementById('state-description').textContent=title;document.getElementById('state-hint').textContent=hint;const extras=[];if(state.screen==='waiting')extras.push(`<button class="demo-btn" data-action="connect-seeker">${ic('phone')}<span><strong>模擬有人接聽</strong><small>進入求助者通話畫面</small></span></button>`);if(state.screen==='call'){extras.push(`<button class="demo-btn" data-action="flip-role">${ic('user')}<span><strong>切換雙方視角</strong><small>目前：${state.role==='seeker'?'求助者':'協助者'}，訊息同步模擬</small></span></button>`)}document.getElementById('demo-extras').innerHTML=extras.join('');document.getElementById('mobile-next').textContent=state.screen==='home'?'模擬接通':state.screen==='waiting'?'有人接聽':state.screen==='incoming'?'接聽':state.screen==='call'?'切換視角':'下一步';const sos=document.getElementById('sos-button');if(sos)bindHold(sos);if(state.overlay==='chat'){const feed=document.getElementById('chat-feed');if(feed)feed.scrollTop=feed.scrollHeight}}

function bindHold(el){const start=e=>{if(holdTicker!==null||state.screen!=='home')return;if(e.type==='pointerdown'){if(e.button!==0&&e.pointerType==='mouse')return;holdPointer=e.pointerId;try{el.setPointerCapture(e.pointerId)}catch{}}if(e.type==='keydown'&&e.repeat)return;completed=false;holdBegin=performance.now();el.classList.add('active');document.getElementById('hold-caption').textContent='持續按住，正在啟動求助…';document.getElementById('hold-hint').textContent='放開即取消';const ring=document.getElementById('hold-ring');holdTicker=setInterval(()=>{const progress=Math.min(100,((performance.now()-holdBegin)/2000)*100);if(ring)ring.style.setProperty('--p',`${progress}%`);if(progress>=100){completed=true;cancelHold();if(navigator.vibrate)try{navigator.vibrate(75)}catch{}startWaiting()}},24)};const end=e=>{if(e.type.startsWith('pointer')&&holdPointer!==null&&e.pointerId!==holdPointer)return;cancelHold()};el.addEventListener('pointerdown',start);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);el.addEventListener('contextmenu',e=>e.preventDefault());el.addEventListener('keydown',e=>{if(['Space','Enter',' '].includes(e.code)||['Enter',' '].includes(e.key)){e.preventDefault();start(e)}});el.addEventListener('keyup',e=>{if(['Space','Enter',' '].includes(e.code)||['Enter',' '].includes(e.key))end(e)})}
function cancelHold(){if(holdTicker!==null){clearInterval(holdTicker);holdTicker=null}holdPointer=null;holdBegin=null;const sos=document.getElementById('sos-button');if(sos)sos.classList.remove('active');const ring=document.getElementById('hold-ring');if(ring)ring.style.setProperty('--p','0%');const caption=document.getElementById('hold-caption');if(caption)caption.textContent='長按 2 秒，發出求助';const hint=document.getElementById('hold-hint');if(hint)hint.textContent='放開可取消 · 完成時震動提示'}
document.addEventListener('input',e=>{if(e.target.id==='event-description'){state.description=e.target.value;const count=document.getElementById('event-count');if(count)count.textContent=state.description.length+'/180'}});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();sendChat()}});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action;switch(action){case 'scenario-sos':reset();break;case 'scenario-incoming':if(!state.notify){toast('請先開啟「接收附近求助」');return}sceneIncoming();break;case 'demo-next':if(state.screen==='home')startWaiting();else if(state.screen==='waiting')connect('seeker');else if(state.screen==='incoming')connect('helper');else if(state.screen==='call') {state.role=state.role==='seeker'?'helper':'seeker';render()}break;case 'restart':reset();break;case 'connect-seeker':connect('seeker');break;case 'accept':connect('helper');break;case 'decline':reset();toast('已略過此次求助');break;case 'flip-role':state.role=state.role==='seeker'?'helper':'seeker';state.overlay='';render();break;case 'toggle-notify':state.notify=!state.notify;render();break;case 'settings':case 'profile':state.overlay='profile';render();break;case 'toggle-notify-profile':{const name=document.getElementById('profile-name');const bio=document.getElementById('profile-bio');if(name)state.profileName=name.value.slice(0,24);if(bio)state.profileBio=bio.value.slice(0,120);state.notify=!state.notify;render();break;}case 'save-profile':{const name=document.getElementById('profile-name');const bio=document.getElementById('profile-bio');state.profileName=(name?.value.trim()||'訪客 01').slice(0,24);state.profileBio=(bio?.value.trim()||'').slice(0,120);state.overlay='';render();toast('已儲存個人簡介（僅供展示）');break;}case 'chat':state.overlay='chat';state.seen[state.role]=state.messages.length;render();break;case 'map':state.overlay='map';render();break;case 'close-overlay':state.overlay='';render();break;case 'going':markGoing();break;case 'toggle-location':state.location=!state.location;render();break;case 'nav-sim':state.overlay='';render();toast('示意導航：正式版會顯示實際路線');break;case 'mute':state.mute=!state.mute;render();break;case 'speaker':state.speaker=!state.speaker;render();break;case 'hangup':state.overlay='hangup';render();break;case 'retry':startWaiting();break;case 'safe':reset();toast('示意：求助事件已結束');break;case 'cancel-help':state.overlay='cancel';render();break;case 'emergency-110':case 'emergency-119':case 'emergency-both':state.overlay='emergency';render();break;}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.overlay){state.overlay='';render()}});
setInterval(()=>{if(state.screen==='call'&&state.connectedAt){const duration=Math.max(0,Math.floor((Date.now()-state.connectedAt)/1000));const el=document.getElementById('call-time');if(el)el.textContent=`${String(Math.floor(duration/60)).padStart(2,'0')}:${String(duration%60).padStart(2,'0')}`}},1000);
render();
})();
</script>
</body>
</html>
