<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F5F5F3">
<meta name="robots" content="noindex">
<meta name="description" content="SafeRadius 展示用原型。語音、配對與定位都是模擬，未連接任何真實服務。緊急情況請直接撥打 110 或 119。">
<title>SafeRadius Demo</title>
<style>
/* 設計變數：拿到 SafeRadius V2 後，先對齊這一段 */
:root{
  --bg:#F8F8F6; --ink:#1E2529; --muted:#747B7E; --card:#FFFFFF; --line:#E8EAE9;
  --sos:#E45450; --sos-soft:#FFF1ED; --call:#151A21; --call2:#29323B; --ok:#2D9D76;
  --on-dark:#F4F5F7; --on-dark-muted:#A5B1BB;
  --r-s:12px; --r-m:18px; --r-l:29px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --t-fast:150ms; --t-mid:240ms; --t-slow:320ms;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --app-h:100dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#E9E8E4;color:var(--ink);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,textarea,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid #2B6CB0;outline-offset:2px}
h1,h2,h3,p{margin:0}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 舞台 */
.stage{height:var(--app-h);display:flex;align-items:center;justify-content:center;gap:24px;padding:16px}
.phone{position:relative;width:390px;height:min(844px,calc(100dvh - 32px));background:var(--bg);overflow:hidden;overflow:clip;
  border-radius:44px;box-shadow:0 0 0 9px #111316,0 24px 60px rgba(0,0,0,.22);container-type:size;
  --safe-top:44px;--safe-bottom:26px;flex:none}
.phone[data-off]{display:none}
.statusbar{position:absolute;inset:0 0 auto 0;height:44px;z-index:70;display:flex;align-items:center;justify-content:space-between;
  padding:6px 30px 0;font-size:14px;font-weight:600;pointer-events:none;color:var(--ink);transition:color var(--t-mid)}
.phone[data-dark] .statusbar{color:var(--on-dark)}
.statusbar .bars{display:flex;gap:3px;align-items:flex-end}
.statusbar .bars i{display:block;width:3px;background:currentColor;border-radius:1px}
.homebar{position:absolute;left:50%;bottom:8px;width:128px;height:5px;margin-left:-64px;border-radius:3px;background:var(--ink);opacity:.85;z-index:70;pointer-events:none;transition:background var(--t-mid)}
.phone[data-dark] .homebar{background:#fff}

@media (max-width:520px){
  html,body{background:var(--bg)}
  .stage{padding:0;gap:0;display:block}
  .phone{width:100%;height:var(--app-h);border-radius:0;box-shadow:none;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
  .statusbar,.homebar{display:none}
}

/* 畫面切換 */
/* 舊畫面留在下層不淡出，新畫面在上層淡入蓋過去，兩邊的文字才不會疊在一起 */
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;background:var(--bg);opacity:0;visibility:hidden;
  transform:translateY(8px);transition:opacity 0s linear var(--t-mid),transform 0s linear var(--t-mid),visibility 0s linear var(--t-mid)}
.screen.active{z-index:2;opacity:1;visibility:visible;transform:none;transition:opacity var(--t-mid) ease,transform var(--t-mid) var(--ease)}
.screen.dark{background:var(--call);color:var(--on-dark)}
.demo-tag{display:inline-block;font-size:11px;line-height:16px;padding:0 6px;border-radius:6px;background:rgba(32,32,32,.07);color:var(--muted);white-space:nowrap}
.dark .demo-tag{background:rgba(255,255,255,.09);color:var(--on-dark-muted)}

/* 首頁 */
.home{padding:calc(var(--safe-top) + 12px) 24px 0}
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tagline{font-size:13px;color:var(--muted);margin-top:2px}
.avatar-btn{position:relative;width:44px;height:44px;border-radius:50%;flex:none}
.avatar{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#46505F;color:#fff;font-weight:600;width:100%;height:100%;font-size:16px;user-select:none}
.avatar-btn .dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--bg)}
.avatar-btn .dot.off{background:#B9B9B4}
.notify-line{font-size:12px;color:var(--muted);text-align:right;margin-top:4px;min-height:16px}
.home-main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:4px 0 8px;scrollbar-width:none}
.home-main::-webkit-scrollbar{display:none}
.home-main h1{font-size:clamp(24px,4cqh,28px);font-weight:700;letter-spacing:-.01em;margin-top:auto;text-align:center}
.home-main .sub{font-size:15px;color:var(--muted);margin-top:4px;text-align:center}
.sos-wrap{--size:clamp(168px,29cqh,224px);position:relative;width:calc(var(--size) + 40px);height:calc(var(--size) + 40px);flex:none;margin:clamp(8px,2cqh,20px) 0 0;display:flex;align-items:center;justify-content:center}
.sos-halo{position:absolute;inset:0;border-radius:50%;background:var(--sos-soft);transition:transform var(--t-slow) var(--ease),opacity var(--t-slow)}
.sos{position:relative;width:var(--size);height:var(--size);border-radius:50%;background:var(--sos);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  box-shadow:0 6px 18px rgba(216,61,56,.28);transition:transform var(--t-mid) var(--ease);display:flex;align-items:center;justify-content:center;flex-direction:column}
.sos b{font-size:clamp(30px,4.8cqh,38px);font-weight:700;letter-spacing:.04em;line-height:1.2}
.sos-ring{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);transform:rotate(-90deg);pointer-events:none}
.sos-ring circle{fill:none;stroke-width:3.2}
.sos-ring .prog{stroke:var(--sos);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0;transition:opacity var(--t-fast)}
.phone.holding .sos{transform:scale(.97)}
.phone.holding .sos-halo{transform:scale(1.02)}
.phone.holding .sos-ring .prog{opacity:1}
.phone.fired .sos{transform:scale(1.06)}
.phone.fired .sos-halo{transform:scale(1.22);opacity:0}
.hold-hint{font-size:13px;color:var(--muted);min-height:20px;margin-top:2px;text-align:center}
.phone.holding .hold-hint{color:var(--sos);font-weight:500}
.brief{width:100%;margin-top:8px;margin-bottom:auto;flex:none}
.brief-box{position:relative;background:var(--card);border-radius:var(--r-m);border:1px solid var(--line);padding:12px 16px;transition:border-color var(--t-fast)}
.brief-box:focus-within{border-color:#BDBDB7}
.brief textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;font-size:16px;line-height:22px;padding:0;max-height:88px}
.brief textarea::placeholder{color:#8C8C88}
.brief .count{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.a11y-link{display:block;margin:8px auto 0;font-size:12px;color:var(--muted);min-height:32px;padding:6px 8px;text-decoration:underline;text-underline-offset:2px}
.a11y-link.armed{color:var(--sos);font-weight:600}
.home-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 calc(var(--safe-bottom) + 12px);border-top:1px solid var(--line)}
.loc-state{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.loc-state i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.loc-state i.off{background:#B9B9B4}
.emg{display:flex;gap:8px;flex:none}
.emg button{min-width:56px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;padding:0 12px;transition:transform var(--t-fast)}
.emg button:active{transform:scale(.96)}
.emg button span{font-weight:400;font-size:11px;color:var(--muted);margin-left:3px}
.dark .emg button{background:var(--call2);border-color:transparent;color:var(--on-dark)}
.dark .emg button span{color:var(--on-dark-muted)}

/* 等待 */
.searching{padding:calc(var(--safe-top) + 12px) 24px calc(var(--safe-bottom) + 16px);align-items:center;text-align:center}
.top-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top-row .brand{font-size:16px;font-weight:600}
.pulse{position:relative;width:176px;height:176px;margin:clamp(12px,5cqh,40px) 0 clamp(8px,3cqh,24px);display:flex;align-items:center;justify-content:center;flex:none}
.pulse i{position:absolute;inset:0;border-radius:50%;background:var(--sos-soft);animation:wave 2.8s ease-out infinite}
.pulse i:nth-child(2){animation-delay:.93s}.pulse i:nth-child(3){animation-delay:1.86s}
.pulse b{position:relative;width:76px;height:76px;border-radius:50%;background:var(--sos);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
@keyframes wave{0%{transform:scale(.42);opacity:.95}100%{transform:scale(1);opacity:0}}
.searching h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.searching .sub{font-size:15px;color:var(--muted);margin-top:6px;line-height:22px}
.search-status{font-size:13px;color:var(--ink);margin-top:12px;min-height:40px;line-height:20px}
.sent{width:100%;background:var(--card);border-radius:var(--r-m);padding:12px 16px;text-align:left;margin-top:auto}
.sent small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.sent p{font-size:15px;line-height:22px;overflow-wrap:anywhere;max-height:88px;overflow:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:26px;font-size:16px;font-weight:600;padding:8px 16px;transition:transform var(--t-fast),background var(--t-fast),opacity var(--t-fast);text-align:center}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.line{border:1px solid #CFCEC9;background:var(--card)}
.btn.solid{background:var(--ink);color:#fff}
.btn.danger{background:var(--sos);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.quiet{background:var(--call2);color:var(--on-dark)}
.btn.ghost{background:none;font-weight:500;min-height:44px}
.dark .btn.ghost{color:var(--on-dark-muted)}
.search-actions{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:12px}
.search-actions .emg{justify-content:center}

/* 來電 */
.incoming{padding:calc(var(--safe-top) + 16px) 24px calc(var(--safe-bottom) + 24px);align-items:center;text-align:center}
.incoming .eyebrow{font-size:15px;font-weight:600;margin-top:clamp(4px,3cqh,24px)}
.big-avatar{position:relative;width:96px;height:96px;margin:clamp(12px,3.5cqh,28px) 0 12px;flex:none}
.big-avatar .avatar{font-size:34px;background:#3A4250}
.incoming .ring-a{position:absolute;inset:-12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);animation:softring 2s ease-out infinite}
@keyframes softring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.2);opacity:0}}
.incoming h2{font-size:28px;font-weight:600}
.approx{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--on-dark-muted);margin-top:6px}
.approx .i{width:16px;height:16px}
.inc-brief{width:100%;background:var(--call2);border-radius:var(--r-m);padding:12px 16px;margin-top:clamp(12px,3cqh,24px);text-align:left;max-height:30cqh;overflow:auto}
.inc-brief small{display:block;font-size:12px;color:var(--on-dark-muted);margin-bottom:4px}
.inc-brief p{font-size:16px;line-height:24px;overflow-wrap:anywhere}
.persona-note{font-size:12px;color:var(--on-dark-muted);margin-top:8px;min-height:16px}
.inc-actions{margin-top:auto;display:flex;justify-content:space-around;width:100%;padding-top:12px}
.round-col{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;min-width:96px}
.round{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform var(--t-fast)}
.round-col:active .round{transform:scale(.94)}
.round.skip{background:#4A505C}
.round.yes{background:var(--ok)}
.round .i{width:30px;height:30px}

/* 配對成功 */
.connecting{align-items:center;justify-content:center;text-align:center;padding:24px}
.tick{width:88px;height:88px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;color:#fff;animation:pop var(--t-slow) var(--ease)}
.tick .i{width:42px;height:42px;stroke-width:2.2}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.connecting h2{font-size:22px;font-weight:600;margin-top:20px}
.connecting p{font-size:14px;color:var(--on-dark-muted);margin-top:6px}

/* 通話 */
.call{padding:calc(var(--safe-top) + 8px) 20px calc(var(--safe-bottom) + 12px)}
.call-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.call-head .l{min-width:0}
.call-head .brand{font-size:14px;font-weight:600}
.conn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--on-dark-muted);margin-top:1px;white-space:nowrap}
.conn i{width:6px;height:6px;border-radius:50%;background:#4CC38A}
.call.ended .conn i{background:#7A808C}
.chip110{height:32px;padding:0 12px;border-radius:16px;background:var(--call2);font-size:13px;font-weight:600;position:relative}
.chip110::after{content:"";position:absolute;inset:-6px}
.call-mid{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;text-align:center;scrollbar-width:none}
.call-mid::-webkit-scrollbar{display:none}
.call-mid .big-avatar{width:clamp(72px,12cqh,104px);height:clamp(72px,12cqh,104px);margin:clamp(4px,2cqh,20px) 0 10px}
.voice{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(76,195,138,.5);animation:softring 2.4s ease-out infinite}
.call.ended .voice{display:none}
.call h2{font-size:24px;font-weight:600;overflow-wrap:anywhere}
.timer{font-size:15px;color:var(--on-dark-muted);font-variant-numeric:tabular-nums;margin-top:2px}
.help-status{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;margin-top:8px;padding:5px 12px;border-radius:14px;background:var(--call2);transition:background var(--t-mid),color var(--t-mid)}
.help-status.go{background:rgba(32,139,83,.22);color:#6EDBA4}
.help-status.end{background:rgba(255,255,255,.07);color:var(--on-dark-muted)}
.call-brief{width:100%;background:var(--call2);border-radius:var(--r-s);padding:8px 12px;margin-top:clamp(8px,2cqh,16px);text-align:left;font-size:14px;line-height:20px;overflow-wrap:anywhere;flex:none}
.call-brief small{font-size:11px;color:var(--on-dark-muted);display:block}
.call-brief p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.call-brief.open p{display:block}
.call-tools{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.tool-row{display:flex;gap:8px}
.tool-row .btn{min-height:48px;font-size:15px;border-radius:24px;flex:1;min-width:0}
.go-hint{font-size:12px;color:var(--on-dark-muted);text-align:center;min-height:0}
.loc-line{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:#6EDBA4;padding:0 4px;min-height:32px}
.loc-line button{font-size:13px;color:var(--on-dark-muted);text-decoration:underline;text-underline-offset:2px;min-height:32px;padding:0 4px;white-space:nowrap}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-top:12px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--on-dark-muted);min-height:44px;position:relative}
.ctl .disc{width:56px;height:56px;border-radius:50%;background:var(--call2);color:var(--on-dark);display:flex;align-items:center;justify-content:center;transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast)}
.ctl:active:not(:disabled) .disc{transform:scale(.93)}
.ctl[aria-pressed="true"] .disc{background:var(--on-dark);color:var(--call)}
.ctl.hang .disc{background:var(--sos);color:#fff}
.ctl:disabled{opacity:.45}
.badge{position:absolute;top:-2px;left:50%;margin-left:12px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--sos);color:#fff;font-size:12px;font-weight:600;line-height:20px;text-align:center}
.mini-call{display:flex;align-items:center;gap:8px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.mini-call .who{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-call .who span{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:6px}
.mini-btn{width:40px;height:40px;border-radius:50%;background:#EFEEEA;display:flex;align-items:center;justify-content:center;flex:none;transition:background var(--t-fast)}
.mini-btn .i{width:20px;height:20px}
.mini-btn[aria-pressed="true"]{background:var(--ink);color:#fff}
.mini-btn.hang{background:var(--sos);color:#fff}

/* 協助者掛斷後、結束畫面 */
.after{padding:calc(var(--safe-top) + 24px) 24px calc(var(--safe-bottom) + 20px);text-align:center;align-items:center;overflow:auto}
.after h2{font-size:24px;font-weight:700;margin-top:16px}
.after .sub{font-size:15px;line-height:22px;margin-top:8px;color:var(--muted)}
.after.dark .sub{color:var(--on-dark-muted)}
.after .acts{width:100%;margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
.after .ask{width:100%;background:var(--call2);border-radius:var(--r-m);padding:16px;text-align:left;font-size:15px;line-height:22px;margin-top:20px}
.after .ask b{display:block;margin-bottom:2px}
.sum{width:100%;margin-top:24px;background:var(--card);border-radius:var(--r-m);padding:4px 16px;text-align:left}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:14px;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}
.sum div span:first-child{color:var(--muted)}
.tick.soft{background:var(--ok);margin-top:clamp(12px,6cqh,56px)}
.ic-dim{width:72px;height:72px;border-radius:50%;background:var(--call2);display:flex;align-items:center;justify-content:center;margin-top:clamp(8px,4cqh,32px);flex:none}

/* 底部抽屜 */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;visibility:hidden;z-index:30;transition:opacity var(--t-mid),visibility 0s linear var(--t-mid)}
.scrim.on{opacity:1;visibility:visible;transition:opacity var(--t-mid)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);color:var(--ink);border-radius:var(--r-l) var(--r-l) 0 0;z-index:40;display:flex;flex-direction:column;
  transform:translateY(102%);visibility:hidden;transition:transform var(--t-slow) var(--ease),visibility 0s linear var(--t-slow);max-height:calc(100% - var(--safe-top) - 8px)}
.sheet.open{transform:none;visibility:visible;transition:transform var(--t-slow) var(--ease)}
.sheet.dragging{transition:none}
.sheet[data-sheet="info"],.sheet[data-sheet="emergency"]{z-index:55}
.scrim.over{z-index:52}
.sheet.full{top:calc(var(--safe-top) + 60px);max-height:none}
.grip{flex:none;display:block;width:100%;height:24px;position:relative;touch-action:none;cursor:grab}
.grip::after{content:"";position:absolute;left:50%;top:9px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#D5D4CF}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 8px}
.sheet-head h3{font-size:17px;font-weight:600}
.x{width:40px;height:40px;border-radius:50%;background:#EFEEEA;display:flex;align-items:center;justify-content:center;flex:none}
.x .i{width:20px;height:20px}
.sheet-body{padding:0 20px calc(var(--safe-bottom) + 16px);overflow:auto}
.sheet-body p{font-size:15px;line-height:23px}
.sheet-body p+p{margin-top:10px}
.sheet-body .muted{color:var(--muted);font-size:13px;line-height:20px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:block;width:100%;text-align:left;border-radius:var(--r-m);padding:14px 16px;border:1px solid var(--line);transition:transform var(--t-fast)}
.opt:active{transform:scale(.985)}
.opt b{display:block;font-size:16px;font-weight:600}
.opt span{display:block;font-size:13px;line-height:19px;color:var(--muted);margin-top:2px}
.opt.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.primary span{color:#C9C9C9}
.opt.safe b{color:var(--ok)}
.en-note{background:#F2F7F3;color:#1C6E43;border-radius:var(--r-s);padding:10px 12px;font-size:14px;line-height:20px;margin-top:12px}

/* 訊息 */
.chat-list{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:#FAFAF8;overscroll-behavior:contain}
.chat-empty{margin:auto;font-size:14px;color:var(--muted);text-align:center;line-height:21px}
.msg{max-width:80%;display:flex;flex-direction:column;animation:msgin var(--t-mid) var(--ease)}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .b{padding:9px 13px;border-radius:18px;font-size:15px;line-height:21px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg time{font-size:11px;color:var(--muted);margin-top:3px;padding:0 4px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.mine .b{background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start}
.msg.them .b{background:#ECEBE7;border-bottom-left-radius:6px}
.msg.sys{align-self:center;max-width:92%;text-align:center}
.msg.sys .b{background:none;padding:2px 8px;font-size:12px;line-height:18px;color:var(--muted)}
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(var(--safe-bottom) + 8px);border-top:1px solid var(--line);background:var(--card)}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:112px;border-radius:22px;border:1px solid var(--line);background:#FAFAF8;padding:10px 16px;font-size:16px;line-height:22px;resize:none;outline:0}
.composer textarea:focus{border-color:#BDBDB7}
.send{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:opacity var(--t-fast),transform var(--t-fast)}
.send:disabled{opacity:.3}
.send:active:not(:disabled){transform:scale(.92)}

/* 地圖 */
.map-wrap{position:relative;flex:1;min-height:180px;background:#ECEBE5;overflow:hidden}
.map-wrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-tag{position:absolute;left:12px;top:12px;font-size:11px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.92);color:var(--muted)}
.m-marker{transition:opacity var(--t-mid)}
.m-halo{animation:mh 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mh{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.m-route{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.m-route-bg{fill:none;stroke:rgba(32,139,83,.2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.map-foot{flex:none;padding:12px 16px calc(var(--safe-bottom) + 12px);display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.map-info{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.map-info b{font-size:16px;font-weight:600}
.map-info span{font-size:12px;color:var(--muted);white-space:nowrap}
.map-note{font-size:13px;line-height:19px;color:var(--muted)}
.map-foot .btn{min-height:48px;font-size:15px}
.map-foot .row{display:flex;gap:8px}

/* 個人設定 */
.profile{position:absolute;inset:0;background:var(--bg);z-index:50;transform:translateX(102%);visibility:hidden;transition:transform var(--t-slow) var(--ease),visibility 0s linear var(--t-slow);display:flex;flex-direction:column}
.profile.open{transform:none;visibility:visible;transition:transform var(--t-slow) var(--ease)}
.pf-head{display:flex;align-items:center;gap:4px;padding:calc(var(--safe-top) + 6px) 12px 8px}
.pf-head h2{font-size:17px;font-weight:600;flex:1;text-align:center;padding-right:44px}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.pf-body{flex:1;overflow:auto;padding:4px 20px calc(var(--safe-bottom) + 24px)}
.pf-card{display:flex;gap:16px;align-items:center;padding:8px 0 16px}
.pf-card .pic{width:72px;height:72px;flex:none}
.pf-card .pic .avatar{font-size:26px}
.pf-card b{display:block;font-size:20px;font-weight:600;overflow-wrap:anywhere}
.pf-card p{font-size:14px;color:var(--muted);line-height:20px;margin-top:2px;overflow-wrap:anywhere}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{display:block;width:100%;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);padding:11px 12px;font-size:16px;line-height:22px;outline:0;resize:none}
.field input:focus,.field textarea:focus{border-color:#A9A9A4}
.field-err{font-size:13px;color:var(--sos);min-height:18px;margin-top:4px}
.swatches{display:flex;gap:10px;margin-top:4px}
.sw{width:36px;height:36px;border-radius:50%;position:relative}
.sw::after{content:"";position:absolute;inset:-4px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.group-t{font-size:13px;color:var(--muted);margin:20px 0 6px;font-weight:500}
.group{background:var(--card);border-radius:var(--r-m);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:10px 16px;text-align:left;font-size:15px}
.group>.row+.row{border-top:1px solid var(--line)}
.row small{display:block;font-size:12px;color:var(--muted);margin-top:1px;line-height:17px}
.row .val{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:2px;white-space:nowrap}
.row .val .i{width:16px;height:16px}
.switch{position:relative;width:50px;height:30px;border-radius:15px;background:#D9D8D3;flex:none;transition:background var(--t-mid)}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform var(--t-mid) var(--ease)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* 提示 */
.toast{position:absolute;left:16px;right:16px;top:calc(var(--safe-top) + 8px);z-index:60;background:rgba(32,32,32,.94);color:#fff;border-radius:var(--r-s);padding:10px 14px;font-size:14px;line-height:20px;
  opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity var(--t-mid),transform var(--t-mid) var(--ease),visibility 0s linear var(--t-mid);pointer-events:none}
.toast.on{opacity:1;visibility:visible;transform:none;transition:opacity var(--t-mid),transform var(--t-mid) var(--ease)}
.phone[data-dark] .toast{background:#F4F5F7;color:#17191F}

/* Demo 控制 */
.panel{width:296px;max-height:min(844px,calc(100dvh - 32px));background:#fff;border-radius:var(--r-l);box-shadow:0 8px 28px rgba(0,0,0,.08);display:flex;flex-direction:column;flex:none;overflow:hidden}

.panel-head h3{font-size:15px;font-weight:600}

.panel-body{overflow:auto;padding:0 16px 16px}
.panel-state{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);background:#F5F5F3;border-radius:10px;padding:7px 10px;margin-bottom:10px}
.panel-state code{font-family:ui-monospace,Consolas,monospace;color:var(--ink)}
.p-t{font-size:12px;color:var(--muted);margin:12px 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#EFEEEA;border-radius:12px;padding:3px}
.seg button{min-height:38px;border-radius:9px;font-size:14px;transition:background var(--t-fast)}
.seg button[aria-pressed="true"]{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button:disabled{opacity:.45}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p-btn{min-height:42px;border-radius:10px;background:#F2F1ED;font-size:13px;line-height:17px;padding:4px 8px;transition:background var(--t-fast)}
.p-btn:hover:not(:disabled){background:#E8E7E2}
.p-btn:disabled{opacity:.42}
.p-btn.wide{grid-column:1/3}
.p-btn.warn{color:var(--sos)}
.p-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;min-height:42px}
.p-row small{display:block;font-size:11px;color:var(--muted);line-height:15px}
.p-hint{font-size:12px;line-height:17px;color:var(--muted);margin-top:8px}
.handle{display:none}
@media (max-width:1000px){

  .handle{position:fixed;right:0;top:34%;z-index:90;width:26px;height:64px;border-radius:12px 0 0 12px;background:rgba(32,32,32,.5);color:#fff;font-size:10px;font-weight:600;writing-mode:vertical-rl;letter-spacing:.06em;display:flex;align-items:center;justify-content:center}

}

    <symbol id="i-hang" viewBox="0 0 24 24"><path d="M3 14.5c5-4.7 13-4.7 18 0l-2.2 2.6-3.6-1.2-.4-2.6a10 10 0 0 0-5.6 0l-.4 2.6-3.6 1.2L3 14.5z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 3.5 9.5 3l1.6 4-2 1.5a12 12 0 0 0 6.4 6.4l1.5-2 4 1.6-.5 2.9a2 2 0 0 1-2 1.6A16 16 0 0 1 5 5.5a2 2 0 0 1 1.6-2z"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></symbol>

  </defs>
</svg>

<div class="stage" id="stage"></div>
<button class="handle" id="handle" aria-label="開啟 Demo 控制">DEMO</button>

<script>
'use strict';
/* ========== 常數與模擬資料（全部虛構） ========== */
const HOLD_MS = 2000, DEVICES = ['me','peer'];
const PERSONA = { requester:'小晴', helpers:['陳小芸','阿哲','吳姐'], peerColor:'#6B5B7B' };
const LINES = {
  requester:['我在便利商店附近，有人在跟著我。','我現在在店裡了。','謝謝你，我先待在店裡。'],
  helper:['我先陪你通話，你可以往有店員的地方走嗎？','好的，我會保持連線。','我離你不遠，有需要就告訴我。'],
};
const SIM_BRIEF = '我好像被陌生人尾隨';
const ROUTE_M = 860, ROUTE_MIN = 11;
const COLORS = ['#46505F','#2F6F5E','#7A5C3E','#6B5B7B','#35637F'];

const icon = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;

/* ========== 集中式狀態：事件、通話、前往、位置、訊息、個人、Demo 分開管理 ========== */
const newUi = () => ({ sheet:null, emergency:null, simDial:false, info:null, profile:false, editing:false, holding:false, tapArmed:false, draft:'', chatDraft:'', briefOpen:false });
const initial = () => ({
  profile:{ name:'林予安', bio:'住在這附近，下班後通常都在。', color:COLORS[0], notify:true, sound:true, vibrate:true, locationPerm:true },
  event:null,
  call:{ status:'none', startedAt:null, base:0, endReason:null, mute:{requester:false,helper:false}, speaker:{requester:false,helper:false} },
  help:{ status:'none', progress:0, decided:false },
  location:{ shared:false },
  chat:{ messages:[], unread:{requester:0,helper:0}, cursor:{requester:0,helper:0} },
  demo:{ view:'me', dual:false, auto:true, panelOpen:window.innerWidth>1000 },
  ui:{ me:newUi(), peer:newUi() },
});
let S = initial();
let seq = 0, msgSeq = 0;

/* ---------- 計時器：都記名、都能一起清掉，事件換了就不執行 ---------- */
const timers = new Map();
function later(key, ms, fn){
  clearTimeout(timers.get(key));
  const eid = S.event && S.event.id;
  timers.set(key, setTimeout(()=>{ timers.delete(key); if(eid && (!S.event || S.event.id!==eid)) return; fn(); sync(); }, ms));
}
function cancel(...keys){ keys.forEach(k=>{ clearTimeout(timers.get(k)); timers.delete(k); }); }
function cancelAll(){ timers.forEach(t=>clearTimeout(t)); timers.clear(); }

/* ---------- 衍生值 ---------- */
const other = d => d==='me' ? 'peer' : 'me';
const reqDev = () => S.event ? S.event.requesterDevice : null;
const helpDev = () => S.event ? other(S.event.requesterDevice) : null;
const roleOf = d => !S.event ? null : (d===reqDev() ? 'requester' : 'helper');
const devOfRole = r => r==='requester' ? reqDev() : helpDev();
const requesterName = () => reqDev()==='me' ? S.profile.name : PERSONA.requester;
const helperName = () => (helpDev()==='me' && S.event.candidateIdx===0) ? S.profile.name : PERSONA.helpers[S.event.candidateIdx];
const nameOfRole = r => r==='requester' ? requesterName() : helperName();
const maskName = n => { const c=[...n]; return c.length<=1 ? n+'○' : c[0]+'○'.repeat(Math.min(c.length-1,2)); };
const colorOf = name => name===S.profile.name ? S.profile.color : (name===PERSONA.requester ? PERSONA.peerColor : '#3A5F78');
const autoOn = () => S.demo.auto && !S.demo.dual;
const isSim = role => S.event && autoOn() && devOfRole(role)!==S.demo.view;
const fmt = sec => `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
const nowHM = () => new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
function callSeconds(){
  const c=S.call; const live = c.status==='active' ? (Date.now()-c.startedAt)/1000 : 0;
  return Math.floor(c.base+live);
}
function viewOf(d){
  const e=S.event; if(!e) return 'home';
  if(roleOf(d)==='requester'){
    if(e.ack.requester) return 'home';
    return {searching:'searching',searchingAgain:'searching',connecting:'connecting',inCall:'call',callEnded:'call',resolved:'resolved'}[e.phase];
  }
  if(e.helperLeft || e.ack.helper) return 'home';
  return {searching:e.ringing?'incoming':'home',searchingAgain:e.ringing?'incoming':'home',connecting:'connecting',inCall:'call',callEnded:'helperEnded',resolved:'resolved'}[e.phase];
}
function machine(d){
  const e=S.event;
  if(viewOf(d)==='home' && S.ui[d].holding) return 'sosHolding';
  if(!e) return 'idle';
  switch(e.phase){
    case 'searching': return e.ringing?'incoming':'searching';
    case 'searchingAgain': return e.ringing?'incoming':'searchingAgain';
    case 'inCall': return ({offered:'helperOffered',enRoute:'helperEnRoute',arrived:'helperArrived'})[S.help.status]||'inCall';
    default: return e.phase;
  }
}
function statusFor(role){
  const s=S.help.status, sh=S.location.shared;
  if(S.call.status==='ended') return {t:'通話已結束',c:'end'};
  if(role==='requester'){
    if(s==='offered') return {t:sh?'協助者準備前往':'協助者願意前往',c:'go'};
    if(s==='enRoute') return {t:'協助者前往中',c:'go'};
    if(s==='arrived') return {t:'協助者已抵達',c:'go'};
    return {t:'正在語音協助',c:''};
  }
  if(s==='offered') return {t:sh?'你準備前往':'你已表示願意前往',c:'go'};
  if(s==='enRoute') return {t:'你正在前往',c:'go'};
  if(s==='arrived') return {t:'你已回報抵達',c:'go'};
  return {t:'正在語音協助',c:''};
}

/* ---------- 回饋：觸覺、鈴聲、提示 ---------- */
function buzz(p){ if(S.profile.vibrate && navigator.vibrate){ try{navigator.vibrate(p)}catch(_){} } }
let audio=null, ringTimer=null;
function unlockAudio(){ if(!audio){ try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } if(audio&&audio.state==='suspended') audio.resume().catch(()=>{}); }
function tone(f,t,d){ const o=audio.createOscillator(),g=audio.createGain(); o.frequency.value=f; o.type='sine';
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05,t+.03); g.gain.linearRampToValueAtTime(0,t+d);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t+d+.02); }
function ringOnce(){ if(!audio) return; try{ const t=audio.currentTime; tone(659,t,.35); tone(880,t+.4,.45); }catch(_){} buzz([200,120,200]); }
function syncRing(){
  const e=S.event, vis = e && e.ringing && !e.helperLeft && (S.demo.dual || helpDev()===S.demo.view);
  const want = vis && S.profile.sound;
  if(want && !ringTimer){ ringOnce(); ringTimer=setInterval(ringOnce,2400); }
  if(!want && ringTimer){ clearInterval(ringTimer); ringTimer=null; }
}
const toastT={};
function toast(d,text,ms=2800){
  const el=phones[d].querySelector('.toast'); el.textContent=text; el.classList.add('on');
  clearTimeout(toastT[d]); toastT[d]=setTimeout(()=>el.classList.remove('on'),ms);
}
function toastVisible(text){ (S.demo.dual?DEVICES:[S.demo.view]).forEach(d=>toast(d,text)); }

/* ---------- 訊息 ---------- */
function pushMsg(from,text){
  S.chat.messages.push({id:++msgSeq,from,text,at:nowHM()});
  if(from==='system') return;
  const to = from==='requester'?'helper':'requester';
  const d = devOfRole(to);
  if(S.ui[d].sheet!=='chat'){ S.chat.unread[to]++; }
}
function nextLine(role){ const a=LINES[role]; const i=S.chat.cursor[role]; S.chat.cursor[role]=Math.min(i+1,a.length-1); return a[i]; }
function resetRound(){
  S.call={ status:'none', startedAt:null, base:0, endReason:null, mute:{requester:false,helper:false}, speaker:{requester:false,helper:false} };
  S.help={ status:'none', progress:0, decided:false };
  S.location.shared=false;
  S.chat={ messages:[], unread:{requester:0,helper:0}, cursor:{requester:0,helper:0} };
  DEVICES.forEach(d=>{ S.ui[d].sheet=null; S.ui[d].chatDraft=''; S.ui[d].briefOpen=false; });
  stopProgress();
}
/* ---------- 模擬前往進度 ---------- */
let progressT=null;
function startProgress(){
  stopProgress();
  progressT=setInterval(()=>{
    if(S.help.status!=='enRoute'){ stopProgress(); return; }
    S.help.progress=Math.min(1,S.help.progress+1/90);
    if(S.help.progress>=1){ stopProgress(); if(isSim('helper')) act.arrive(); }
    sync();
  },500);
}
function stopProgress(){ clearInterval(progressT); progressT=null; }

/* ========== 狀態轉移：所有改動都走這裡，先檢查再改 ========== */
function startEvent(requesterDevice,brief){
  cancelAll(); resetRound();
  S.event={ id:++seq, requesterDevice, brief:brief.trim(), phase:'searching', ringing:false, candidateIdx:0, helperLeft:false, waitingLong:false, prevEnRoute:null, ack:{requester:false,helper:false}, summary:null };
  scheduleRing(requesterDevice===S.demo.view?900:500);
  later('long',20000,()=>{ if(S.event&&/searching/.test(S.event.phase)) S.event.waitingLong=true; });
}
function scheduleRing(ms){
  later('ring',ms,()=>{
    const e=S.event; if(!e||!/searching/.test(e.phase)) return;
    e.ringing=true; if(!e.helperLeft) buzz(60);
    if(isSim('helper')) later('autoAccept',3200,()=>act.accept());
  });
}
const act = {
  sendSOS(d,brief){
    if(viewOf(d)!=='home') return false;
    startEvent(d,brief); buzz([40,60,120]); return true;
  },
  simIncoming(){
    if(S.demo.view!=='me') S.demo.view='me';
    if(!S.profile.notify){ toast('me','你已關閉「接收附近求助」，這筆模擬求助不會響鈴。'); return; }
    startEvent('peer',SIM_BRIEF);
  },
  cancelSearch(){
    const e=S.event; if(!e||!/searching/.test(e.phase)) return;
    cancelAll(); S.event=null; resetRound(); toastVisible('已取消求助');
  },
  accept(){
    const e=S.event; if(!e||!e.ringing) return;
    cancel('autoAccept','long','ring'); e.ringing=false; e.waitingLong=false; e.phase='connecting'; buzz(50);
    later('conn',900,()=>beginCall());
  },
  skip(){
    const e=S.event; if(!e||!e.ringing) return;
    cancel('autoAccept'); e.ringing=false;
    const viewerIsHelper = autoOn() && helpDev()===S.demo.view;
    const last = e.candidateIdx>=PERSONA.helpers.length-1;
    if(viewerIsHelper){
      e.helperLeft=true; e.candidateIdx = last?0:e.candidateIdx+1;
      toast(helpDev(),'已略過，系統會通知下一位協助者（Demo 模擬）');
      later('autoAccept',3000,()=>{ e.ringing=true; act.accept(); });
      return;
    }
    if(last){ e.candidateIdx=0; e.waitingLong=true; toastVisible('模擬名單已輪完。求助仍在等待，可用 Demo 控制再模擬接聽。'); return; }
    e.candidateIdx++;
    toastVisible(`已略過，模擬通知下一位協助者：${helperName()}`);
    scheduleRing(1200);
  },
  hangup(d,reason){
    const e=S.event; if(!e||e.phase!=='inCall') return;
    cancel('reply','autoOffer','autoStart','autoShare');
    S.call.base=callSeconds(); S.call.status='ended'; S.call.startedAt=null;
    S.call.endReason=reason||roleOf(d);
    e.phase='callEnded';
    DEVICES.forEach(x=>{ S.ui[x].sheet=null; });
    S.help.decided=false; buzz(30);
  },
  reconnect(){
    const e=S.event; if(!e||e.phase!=='callEnded'||S.call.endReason!=='dropped') return;
    e.phase='connecting'; S.call.status='none'; e.helperLeft=false;
    later('conn',900,()=>beginCall(true));
  },
  continueSearch(){
    const e=S.event; if(!e||e.phase!=='callEnded') return;
    const prev=S.help.status==='enRoute'?helperName():null;
    const keep=S.call.endReason;
    resetRound();
    e.prevEnRoute=prev; e.phase='searchingAgain'; e.helperLeft=false; e.waitingLong=false;
    e.candidateIdx=(e.candidateIdx+1)%PERSONA.helpers.length; e.ack={requester:false,helper:false}; void keep;
    scheduleRing(1400);
    later('long',20000,()=>{ if(S.event&&/searching/.test(S.event.phase)) S.event.waitingLong=true; });
  },
  resolve(){
    const e=S.event; if(!e||e.phase!=='callEnded') return;
    cancelAll(); stopProgress();
    e.summary={ dur:fmt(S.call.base), msgs:S.chat.messages.filter(m=>m.from!=='system').length, wasGoing:S.help.status==='enRoute'||S.help.status==='offered' };
    e.phase='resolved'; S.location.shared=false; S.help.status='none';
    DEVICES.forEach(x=>{ S.ui[x].sheet=null; });
    buzz(40);
  },
  ack(d){
    const e=S.event; if(!e) return;
    const r=roleOf(d); e.ack[r]=true;
    if(r==='requester') S.ui[d].draft='';
    const otherDone = r==='requester' ? (e.ack.helper||e.helperLeft||isSim('helper')) : (e.ack.requester||isSim('requester'));
    if(otherDone){ S.event=null; resetRound(); }
  },
  finishHelper(d){
    const e=S.event; if(!e||e.phase!=='callEnded') return;
    if(isSim('requester')){ cancelAll(); S.event=null; resetRound(); toast(d,'已完成本次通話。對方的求助狀態由對方決定。'); return; }
    e.helperLeft=true; S.ui[d].sheet=null; toast(d,'已完成本次通話。對方的求助仍由對方決定。');
  },
  offer(){
    if(!S.event||S.event.phase!=='inCall'||S.help.status!=='none') return;
    cancel('autoOffer');
    S.help.status='offered';
    pushMsg('system',`${helperName()} 表示願意前往，尚未出發`);
    const d=reqDev(); if(viewOf(d)==='call'&&!S.location.shared) toast(d,`${helperName()} 願意前往。要不要分享你的位置，由你決定。`);
    if(isSim('requester')) later('autoShare',3000,()=>{ act.share(); pushMsg('requester',nextLine('requester')); });
    if(isSim('helper')&&S.location.shared) later('autoStart',3500,()=>act.start());
  },
  start(){
    if(S.help.status!=='offered'||!S.location.shared) return;
    S.help.status='enRoute'; S.help.progress=0; S.help.decided=true; cancel('autoStart');
    pushMsg('system',`${helperName()} 已開始前往（Demo 模擬路線）`);
    startProgress();
  },
  arrive(){
    if(S.help.status!=='enRoute') return;
    stopProgress(); S.help.status='arrived'; S.help.progress=1;
    pushMsg('system',`${helperName()} 回報已抵達（Demo 模擬）`); buzz(60);
  },
  cancelGo(){
    if(S.help.status!=='offered'&&S.help.status!=='enRoute') return;
    stopProgress(); cancel('autoStart'); S.help.status='none'; S.help.progress=0; S.help.decided=true;
    pushMsg('system',`${helperName()} 取消了前往，通話中仍可協助`);
    const d=reqDev(); if(viewOf(d)==='call') toast(d,`${helperName()} 取消了前往`);
  },
  keepGoing(){
    S.help.decided=true;
    if(S.help.status==='offered'&&S.location.shared) act.start();
  },
  share(d){
    if(!S.event||S.event.phase!=='inCall'||S.location.shared) return;
    if(reqDev()==='me'&&!S.profile.locationPerm){ toast(d||'me','位置權限未開啟，請到個人設定開啟（Demo 模擬權限）。'); return; }
    S.location.shared=true; pushMsg('system','位置已分享給協助者'); buzz(30);
    if(isSim('helper')){
      if(S.help.status==='none') later('autoOffer',2500,()=>{ act.offer(); });
      else if(S.help.status==='offered') later('autoStart',3000,()=>act.start());
    }
  },
  stopShare(){
    if(!S.location.shared) return;
    S.location.shared=false; pushMsg('system','求助者已停止分享位置');
    cancel('autoStart');
    if(helpDev()&&viewOf(helpDev())==='call') toast(helpDev(),'對方已停止分享位置，路線已隱藏');
  },
  send(role,text){
    const t=text.trim(); if(!t||!S.event||S.event.phase!=='inCall') return false;
    pushMsg(role,t);
    const o=role==='requester'?'helper':'requester';
    if(isSim(o)) later('reply',1800,()=>{ if(S.event.phase==='inCall') pushMsg(o,nextLine(o)); });
    return true;
  },
};
function beginCall(resumed){
  const e=S.event; if(!e) return;
  e.phase='inCall'; S.call.status='active'; S.call.startedAt=Date.now(); S.call.endReason=null;
  if(!resumed) S.call.base=0;
  if(isSim('requester')) later('peerFirst',1600,()=>{ if(S.event.phase==='inCall'&&!S.chat.messages.some(m=>m.from==='requester')) pushMsg('requester',nextLine('requester')); });
  if(isSim('helper')&&!resumed) later('autoOffer',14000,()=>{ if(S.event.phase==='inCall') act.offer(); });
}

/* ========== 畫面模板 ========== */
function mapSVG(){
  // 直式比例：路線集中在中央，手機上被裁切時也不會裁到兩個標記
  const xs=[-60,60,130,215,300,370,480], ys=[-60,110,200,290,370,430,560];
  const route='M60 370 L130 370 L130 290 L215 290 L215 200 L300 200 L300 110 L262 110';
  let cells='';
  for(let i=0;i<xs.length-1;i++) for(let j=0;j<ys.length-1;j++){
    if(i===3&&j===2) continue; // 公園
    const x=xs[i]+9,y=ys[j]+9,w=xs[i+1]-xs[i]-18,h=ys[j+1]-ys[j]-18;
    if((i*3+j*5)%4===0&&h>40){ const a=Math.round(h*.55); cells+=`<rect x="${x}" y="${y}" width="${w}" height="${a}" rx="4"/><rect x="${x}" y="${y+a+7}" width="${w}" height="${h-a-7}" rx="4"/>`; }
    else cells+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`;
  }
  return `<svg viewBox="0 0 420 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Demo 模擬街區地圖，不是真實街道">
  <rect x="-100" y="-100" width="620" height="700" fill="#F5F2E9"/>
  <g transform="rotate(-3 210 250)">
    <g fill="#EEF0E6">${cells}</g>
    <rect x="224" y="209" width="67" height="72" rx="8" fill="#DDEBD9"/>
    <path d="M-80 470 C 40 440, 120 500, 200 580 L -80 580 Z" fill="#D8E6EA"/>
    <g fill="none" stroke="#fff" stroke-linecap="butt">
      <path d="M -80 200 H 500 M -80 370 H 500 M 60 -80 V 600 M 215 -80 V 600 M 370 -80 V 600" stroke-width="8"/>
      <path d="M -80 110 H 500 M -80 290 H 500 M -80 430 H 500 M 130 -80 V 600 M 300 -80 V 600" stroke-width="14"/>
    </g>
    <g font-size="10" fill="#9A9A92" font-family="inherit">
      <text x="146" y="104">示範一路</text>
      <text x="142" y="284">示範二路</text>
      <text x="238" y="248">示範公園</text>
    </g>
    <circle data-approx cx="250" cy="130" r="72" fill="rgba(216,61,56,.13)" stroke="rgba(216,61,56,.35)" stroke-dasharray="4 5"/>
    <path class="m-route-bg" data-route-bg d="${route}"/>
    <path class="m-route" data-route d="${route}"/>
    <g class="m-marker" data-m-req transform="translate(262 110)">
      <circle class="m-halo" r="16" fill="rgba(227,90,79,.3)"/><circle r="8" fill="#E35A4F" stroke="#fff" stroke-width="3"/>
    </g>
    <g class="m-marker" data-m-help transform="translate(60 370)">
      <circle r="10" fill="#246DA5" stroke="#fff" stroke-width="3"/><circle r="3" fill="#fff"/>
    </g>
  </g>
</svg>`;
}
function emgButtons(){
  return `<div class="emg"><button data-act="emergency" data-arg="110" aria-label="110 警察，開啟 Demo 確認畫面">110<span>警察</span></button><button data-act="emergency" data-arg="119" aria-label="119 消防救護，開啟 Demo 確認畫面">119<span>消防救護</span></button></div>`;
}
function phoneHTML(d){
  return `
  <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span></div>

const q=(root,sel)=>root.querySelector(sel);
function setT(el,t){ if(el&&el.textContent!==t) el.textContent=t; }
function setAvatar(el,name,color){ setT(el,[...name][0]||'？'); el.style.background=color; }
function syncSheet(root,name,open){
  const el=q(root,`[data-sheet="${name}"]`); el.classList.toggle('open',open); el.inert=!open;
  if(!open){ el.style.transform=''; }
}
function renderMain(d,root,view){
  const r=roleOf(d); const row=q(root,'[data-row-main]'); const hint=q(root,'[data-go-hint]');
  const ended=S.call.status==='ended'; const h=S.help.status;
  let key,html='',ht='';
  if(ended){ key='ended'; }
  else if(r==='requester'){
    key='req'+S.location.shared;
    if(!S.location.shared) html=`<button class="btn ok" data-act="share">${icon('pin')}分享我的位置</button>`;
  } else if(h==='none'){ key='h0'; html=`<button class="btn ok" data-act="offer">我願意前往協助</button>`; }
  else if(h==='offered'){ key='h1'+S.location.shared;
    html=`<button class="btn ok" data-act="start" ${S.location.shared?'':'disabled'}>確認開始前往</button><button class="btn quiet" data-act="cancelGo" style="flex:none;width:112px">先不前往</button>`;
    if(!S.location.shared) ht='等對方分享位置後，才能開始前往';
  } else if(h==='enRoute'){ key='h2'; html=`<button class="btn ok" data-act="arrive">回報已抵達</button><button class="btn quiet" data-act="cancelGo" style="flex:none;width:112px">取消前往</button>`; }
  else { key='h3'; }
  if(row.dataset.k!==key){ row.dataset.k=key; row.innerHTML=html; }
  row.hidden=!html; setT(hint,ht); hint.hidden=!ht;
  q(root,'[data-loc-line]').hidden=!(r==='requester'&&S.location.shared&&!ended);
}
function renderChat(d,root,r){
  const list=q(root,'[data-chat-list]'); const msgs=S.chat.messages;
  const first=list.firstElementChild; const firstId=first&&first.dataset.id?+first.dataset.id:null;
  if(!msgs.length || (firstId&&firstId!==msgs[0].id) || (list.dataset.role&&list.dataset.role!==r)){
    list.replaceChildren();
  }
  list.dataset.role=r||'';
  if(!msgs.length){ const e=document.createElement('p'); e.className='chat-empty'; e.textContent='通話中也可以傳文字。\n說不出話時，打字一樣能讓對方知道情況。'; e.style.whiteSpace='pre-line'; list.append(e); return; }
  list.querySelector('.chat-empty')?.remove();
  let added=false;
  const have=list.querySelectorAll('.msg').length;
  msgs.slice(have).forEach(m=>{
    const w=document.createElement('div');
    w.className='msg '+(m.from==='system'?'sys':(m.from===r?'mine':'them')); w.dataset.id=m.id;
    const b=document.createElement('div'); b.className='b'; b.textContent=m.text; w.append(b);
    if(m.from!=='system'){ const t=document.createElement('time'); t.textContent=m.at; w.append(t); }
    list.append(w); added=true;
  });
  if(added) requestAnimationFrame(()=>{ list.scrollTop=list.scrollHeight; });
}
function renderMap(d,root,r){
  const sh=S.location.shared, h=S.help.status;
  const req=q(root,'[data-m-req]'), hp=q(root,'[data-m-help]'), rt=q(root,'[data-route]'), rb=q(root,'[data-route-bg]'), ap=q(root,'[data-approx]');

});
stage.addEventListener('keydown',ev=>{
  if(ev.target.matches('[data-chat-input]')&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing&&ev.keyCode!==229){ ev.preventDefault(); sendChat(ev.target.closest('.phone').dataset.device); sync(); }
});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Escape') return;
  DEVICES.forEach(d=>{ const u=S.ui[d]; if(u.emergency){u.emergency=null;} else if(u.info){u.info=null;} else if(u.sheet){u.sheet=null;} else if(u.profile&&!u.editing){u.profile=false;} });
  if(window.innerWidth<=1000) S.demo.panelOpen=false;
  sync();
});

/* 長按 SOS：真的偵測按住，放開就取消 */
function bindSOS(d){
  const root=phones[d], btn=q(root,'[data-sos]'), prog=q(root,'.sos-ring .prog'), hint=q(root,'[data-hold-hint]');
  let raf=0,t0=0,active=false,fired=false;
  const frame=now=>{
    if(!active) return;
    const p=Math.min(1,(now-t0)/HOLD_MS);
    prog.style.strokeDashoffset=String(100-100*p);
    if(p>=1){ finish(); return; }
    raf=requestAnimationFrame(frame);
  };
  const begin=()=>{
    if(active||fired||viewOf(d)!=='home') return;
    active=true; S.ui[d].holding=true; root.classList.add('holding'); t0=performance.now();
    setT(hint,'繼續按住，放開可取消'); buzz(15);
    root.dataset.state=machine(d); syncPanel();
    raf=requestAnimationFrame(frame);
  };
  const end=(cancelled)=>{
    if(!active) return;
    active=false; cancelAnimationFrame(raf); S.ui[d].holding=false; root.classList.remove('holding');
    prog.style.strokeDashoffset='100';
    if(cancelled){ setT(hint,'已取消，沒有發送'); clearTimeout(btn._h); btn._h=setTimeout(()=>setT(hint,'長按 2 秒，發出求助'),1600); root.dataset.state=machine(d); syncPanel(); }
  };
  const finish=()=>{
    end(false); fired=true; root.classList.add('fired');
    setT(hint,'長按 2 秒，發出求助');
    const brief=S.ui[d].draft;
    setTimeout(()=>{ act.sendSOS(d,brief); sync(); root.classList.remove('fired'); fired=false; },220);
    buzz([30,40,90]);
  };
  btn.addEventListener('pointerdown',ev=>{ if(ev.button!==0&&ev.pointerType==='mouse') return; ev.preventDefault(); try{btn.setPointerCapture(ev.pointerId)}catch(_){} begin(); });
  btn.addEventListener('pointerup',()=>end(true));
  btn.addEventListener('pointercancel',()=>end(true));
  btn.addEventListener('lostpointercapture',()=>end(true));
  btn.addEventListener('contextmenu',ev=>ev.preventDefault());
  btn.addEventListener('keydown',ev=>{ if((ev.key===' '||ev.key==='Enter')&&!ev.repeat){ ev.preventDefault(); begin(); } else if(ev.key===' '||ev.key==='Enter') ev.preventDefault(); });
  btn.addEventListener('keyup',ev=>{ if(ev.key===' '||ev.key==='Enter') end(true); });
  btn.addEventListener('blur',()=>end(true));
}
DEVICES.forEach(bindSOS);

/* 拖曳收合抽屜 */
stage.addEventListener('pointerdown',ev=>{
  const g=ev.target.closest('[data-grip]'); if(!g) return;
  const sh=g.closest('.sheet'), d=g.closest('.phone').dataset.device; const y0=ev.clientY; let dy=0;
  sh.classList.add('dragging'); g.setPointerCapture(ev.pointerId);
  const mv=e=>{ dy=Math.max(0,e.clientY-y0); sh.style.transform=`translateY(${dy}px)`; };
  const up=()=>{ g.removeEventListener('pointermove',mv); g.removeEventListener('pointerup',up); g.removeEventListener('pointercancel',up);
    sh.classList.remove('dragging'); sh.style.transform='';
    if(dy>72||dy<3){ const n=sh.dataset.sheet,u=S.ui[d]; if(n==='emergency'){u.emergency=null;u.simDial=false;} else if(n==='info'){u.info=null;} else {u.sheet=null;} sync(); }
  };
  g.addEventListener('pointermove',mv); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
});

/* Demo 控制 */
function switchView(role){
  if(!S.event||S.demo.dual) return;
  const d=devOfRole(role); if(d===S.demo.view) return;
  S.demo.view=d;
  if(S.demo.auto){ S.demo.auto=false; cancel('autoAccept','autoOffer','autoStart','autoShare','reply','peerFirst'); toast(d,'切換視角後，雙方都由你操作。可在 Demo 控制重開自動模擬。'); }
}
const panelAct={
  closePanel(){ S.demo.panelOpen=false; },
  viewRequester(){ switchView('requester'); },
  viewHelper(){ switchView('helper'); },
  simIncoming(){ act.simIncoming(); },
  accept(){ const e=S.event; if(!e) return; if(!e.ringing){ cancel('ring'); e.ringing=true; e.helperLeft=false; } act.accept(); },
  msg(){ const r=(S.demo.dual||roleOf(S.demo.view)==='requester')?'helper':'requester'; if(S.event&&S.event.phase==='inCall') pushMsg(r,nextLine(r)); },
  share(){ act.share(reqDev()); },
  offer(){ act.offer(); }, start(){ act.start(); }, arrive(){ act.arrive(); },
  drop(){ act.hangup(reqDev(),'dropped'); },
  toggleAuto(){ S.demo.auto=!S.demo.auto; if(S.demo.auto&&S.event&&S.event.ringing&&isSim('helper')) later('autoAccept',3200,()=>act.accept()); },
  toggleDual(){ S.demo.dual=!S.demo.dual; if(S.demo.dual) cancel('autoAccept','autoOffer','autoStart','autoShare','reply','peerFirst'); },
  home(){ cancelAll(); stopProgress(); S.event=null; resetRound(); DEVICES.forEach(d=>{ const u=S.ui[d]; u.sheet=null;u.emergency=null;u.info=null;u.profile=false;u.editing=false; }); S.demo.view='me'; },
  reset(){
    cancelAll(); stopProgress(); const po=S.demo.panelOpen,du=S.demo.dual;
    S=initial(); S.demo.panelOpen=po; S.demo.dual=du;
    DEVICES.forEach(d=>{ const r=phones[d]; q(r,'[data-chat-input]').value=''; q(r,'[data-chat-list]').replaceChildren(); autoGrow(q(r,'[data-draft]')); });
    toast('me','Demo 已重設');
  },
};
panel.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-p]'); if(!b||b.disabled) return;
  const fn=panelAct[b.dataset.p]; if(fn){ fn(); sync(); }
  if(window.innerWidth<=1000&&!['closePanel','toggleAuto'].includes(b.dataset.p)&&!b.closest('.seg')) { S.demo.panelOpen=false; sync(); }
  else if(b.closest('.seg')&&window.innerWidth<=1000){ S.demo.panelOpen=false; sync(); }
});
document.getElementById('handle').addEventListener('click',()=>{ S.demo.panelOpen=true; sync(); });

/* 手機鍵盤：畫面高度跟著可視區縮小，輸入框才不會被蓋住 */
if(window.visualViewport){
  const vv=window.visualViewport;
  const fit=()=>{ if(window.innerWidth<=520){ document.documentElement.style.setProperty('--app-h',vv.height+'px'); window.scrollTo(0,0); } else { document.documentElement.style.removeProperty('--app-h'); } };
  vv.addEventListener('resize',fit); vv.addEventListener('scroll',fit); fit();
}
window.addEventListener('resize',()=>{ if(window.innerWidth>1000&&!S.demo.panelOpen) S.demo.panelOpen=true; if(window.innerWidth<=1000&&S.demo.dual){ S.demo.dual=false; } sync(); });

window.SafeRadiusDemo={ state:()=>S, machine:()=>machine(S.demo.view) };
sync();
</script>
